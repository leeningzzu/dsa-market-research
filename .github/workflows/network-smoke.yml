name: Network Smoke

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      public_probe:
        description: Public cloud probe
        required: false
        default: direct-egress
        type: choice
        options:
          - direct-egress
          - 5m-trial

concurrency:
  group: network-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.repository == 'leeningzzu/daily_stock_analysis-private' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🌐 Run pytest network smoke (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -m network -q | tee pytest-network.log

      - name: 🚀 Run quick smoke (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/test.sh quick --no-notify | tee quick-smoke.log

      - name: 📤 Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-smoke-logs-${{ github.run_number }}
          path: |
            pytest-network.log
            quick-smoke.log
          if-no-files-found: ignore

  public-direct-egress:
    name: direct-egress-no-proxy
    if: ${{ github.repository == 'leeningzzu/dsa-market-research' && github.event_name == 'workflow_dispatch' && inputs.public_probe == 'direct-egress' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Reject proxy-configured cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            if [ -n "${!name:-}" ]; then
              echo "::error::CLOUD_PROXY_PRESENT name=${name}"
              exit 1
            fi
          done
      - name: Verify direct EastMoney HTTPS egress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client, socket, ssl
          host="push2his.eastmoney.com"
          addrs=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
          if not addrs: raise SystemExit("DNS_EMPTY")
          ctx=ssl.create_default_context()
          with socket.create_connection((host,443),timeout=10) as s:
              with ctx.wrap_socket(s,server_hostname=host) as tls:
                  version=tls.version()
          c=http.client.HTTPSConnection(host,443,timeout=10,context=ctx)
          try:
              c.request("HEAD","/",headers={"User-Agent":"stock-dsa-direct-egress-smoke/2","Connection":"close"})
              r=c.getresponse(); status=int(r.status); r.read()
          finally:
              c.close()
          if not 100 <= status < 600: raise SystemExit(f"HTTP_STATUS={status}")
          print(f"DIRECT_EGRESS_ZERO_PROXY_PASS host={host} dns={len(addrs)} tls={version} status={status}")
          PY

  public-5m-bounded-trial:
    name: canonical-5m-bounded-trial
    if: ${{ github.repository == 'leeningzzu/dsa-market-research' && github.event_name == 'workflow_dispatch' && inputs.public_probe == '5m-trial' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject proxy-configured cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            if [ -n "${!name:-}" ]; then
              echo "::error::CLOUD_PROXY_PRESENT name=${name}"
              exit 1
            fi
          done
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact BaoStock trial package
        run: python -m pip install --disable-pip-version-check "baostock==0.9.4"
      - name: Run one-symbol canonical 5m bounded trial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.metadata, json, math, os
          from pathlib import Path
          import baostock as bs
          import pandas as pd

          trial="CLOUD_CANONICAL_5M_BAOSTOCK_0_9_4_BOUNDED_TRIAL_R001"
          code="sh.600519"; start="2026-09-23"; end="2026-09-30"
          sessions=["2026-09-23","2026-09-24","2026-09-28","2026-09-29","2026-09-30"]
          fields=["date","time","code","open","high","low","close","volume","amount","adjustflag"]
          proxies=("HTTP_PROXY","HTTPS_PROXY","ALL_PROXY","http_proxy","https_proxy","all_proxy")
          leaked=[n for n in proxies if os.environ.get(n)]
          if leaked: raise SystemExit(f"CLOUD_PROXY_PRESENT names={leaked}")
          version=importlib.metadata.version("baostock")
          if version!="0.9.4": raise SystemExit(f"BAOSTOCK_VERSION_DRIFT={version}")

          login=bs.login()
          if str(login.error_code)!="0": raise SystemExit(f"BAOSTOCK_LOGIN_FAILED code={login.error_code} msg={login.error_msg}")
          login_count=1; query_count=0; logout_count=0
          query_succeeded=False
          try:
              rs=bs.query_history_k_data_plus(
                  code=code,
                  fields=",".join(fields),
                  start_date=start,
                  end_date=end,
                  frequency="5",
                  adjustflag="2",
              )
              query_count=1
              if str(rs.error_code)!="0": raise SystemExit(f"BAOSTOCK_QUERY_FAILED code={rs.error_code} msg={rs.error_msg}")
              if list(rs.fields)!=fields: raise SystemExit(f"FIELD_DRIFT={list(rs.fields)}")
              rows=[]
              while rs.next(): rows.append(rs.get_row_data())
              if not rows: raise SystemExit("EMPTY_5M_RESPONSE")
              query_succeeded=True
          finally:
              logout=bs.logout(); logout_count=1
          if str(logout.error_code)!="0": raise SystemExit(f"BAOSTOCK_LOGOUT_FAILED code={logout.error_code} msg={logout.error_msg}")
          if not query_succeeded: raise SystemExit("BAOSTOCK_QUERY_NOT_COMPLETED")

          d=pd.DataFrame(rows,columns=fields)
          raw_time=d["time"].astype(str)
          if (~raw_time.str.match(r"^\d{14,17}$")).any(): raise SystemExit("TIME_FORMAT_INVALID")
          d["_ts"]=pd.to_datetime(raw_time.str.slice(0,14),format="%Y%m%d%H%M%S",errors="coerce")
          if d["_ts"].isna().any() or d["_ts"].duplicated().any() or not d["_ts"].is_monotonic_increasing:
              raise SystemExit("TIMESTAMP_INVALID")
          if (d["date"].astype(str)!=d["_ts"].dt.strftime("%Y-%m-%d")).any(): raise SystemExit("DATE_TIME_MISMATCH")
          if (d["code"].astype(str)!=code).any(): raise SystemExit("CODE_MISMATCH")
          if (d["adjustflag"].astype(str)!="2").any(): raise SystemExit("ADJUSTFLAG_MISMATCH")
          for c in ["open","high","low","close","volume","amount"]:
              d[c]=pd.to_numeric(d[c],errors="coerce")
              if d[c].isna().any() or not d[c].map(math.isfinite).all(): raise SystemExit(f"NUMERIC_INVALID={c}")
          if (d[["open","high","low","close"]]<=0).any().any(): raise SystemExit("OHLC_NONPOSITIVE")
          if (d[["volume","amount"]]<0).any().any(): raise SystemExit("VOLUME_AMOUNT_NEGATIVE")
          if ((d["high"]<d[["open","close","low"]].max(axis=1))|(d["low"]>d[["open","close","high"]].min(axis=1))).any():
              raise SystemExit("OHLC_ENVELOPE_INVALID")

          expected=[]
          for s in sessions:
              expected += list(pd.date_range(f"{s} 09:35:00",f"{s} 11:30:00",freq="5min"))
              expected += list(pd.date_range(f"{s} 13:05:00",f"{s} 15:00:00",freq="5min"))
          actual=d["_ts"].tolist()
          counts=d.assign(_s=d["_ts"].dt.strftime("%Y-%m-%d")).groupby("_s").size().to_dict()
          if actual!=expected: raise SystemExit(f"SESSION_OR_RIGHT_LABEL_MISMATCH rows={len(actual)} counts={counts}")

          canon=d[fields].copy()
          digest=hashlib.sha256(canon.to_csv(index=False,lineterminator="\n").encode()).hexdigest()
          receipt={"schema":"stock-dsa-cloud-5m-baostock-bounded-trial-v1","trial_id":trial,"trial_result":"PASS",
                   "baostock_version":version,"callable":"query_history_k_data_plus","code":code,"start_date":start,"end_date":end,
                   "frequency":"5","adjustflag":"2","returned_fields":fields,"row_count":len(d),"session_dates":sessions,"bars_per_session":counts,
                   "first_timestamp":actual[0].strftime("%Y-%m-%d %H:%M:%S"),"last_timestamp":actual[-1].strftime("%Y-%m-%d %H:%M:%S"),
                   "duplicate_count":0,"off_session_count":0,"lunch_count":0,"ohlc_valid":True,"volume_nonnegative":True,"amount_nonnegative":True,
                   "raw_volume_unit":"UNPROVEN_BY_CURRENT_TRIAL_CONTRACT","raw_amount_unit":"UNPROVEN_BY_CURRENT_TRIAL_CONTRACT",
                   "data_sha256":digest,"proxy_env_present":False,"login_count":login_count,"query_count":query_count,"logout_count":logout_count,
                   "retry_count":0,"provider_fallback_count":0,"raw_rows_persisted":False}
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with Path(summary).open("a",encoding="utf-8") as h:
                  h.write("## STOCK_DSA canonical 5m BaoStock bounded trial\n\n```json\n")
                  h.write(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)); h.write("\n```\n")
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
