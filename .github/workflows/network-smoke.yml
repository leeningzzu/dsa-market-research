name: Network Smoke

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Legacy smoke or explicitly bounded public CN daily/5m source probes'
        type: choice
        required: true
        default: legacy
        options:
          - legacy
          - cn-daily-readonly-probe
          - cn-intraday-readonly-probe

concurrency:
  group: network-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.repository == 'leeningzzu/daily_stock_analysis-private' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🌐 Run pytest network smoke (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -m network -q | tee pytest-network.log

      - name: 🚀 Run quick smoke (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/test.sh quick --no-notify | tee quick-smoke.log

      - name: 📤 Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-smoke-logs-${{ github.run_number }}
          path: |
            pytest-network.log
            quick-smoke.log
          if-no-files-found: ignore

  cn-daily-readonly-probe:
    # Public-only, explicit one-off dispatch. No schedule, Environment, Secrets,
    # report, database, model, SMTP, Telegram, uploads or artifact persistence.
    if: ${{ github.repository == 'leeningzzu/dsa-market-research' && github.event_name == 'workflow_dispatch' && inputs.mode == 'cn-daily-readonly-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout existing DSA source
        uses: actions/checkout@v5

      - name: Use existing DSA Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install existing requirements only
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY FTP_PROXY SOCKS_PROXY http_proxy https_proxy all_proxy ftp_proxy socks_proxy
          python -m pip install -r requirements.txt

      - name: Inspect one completed CN daily source without a proxy
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY FTP_PROXY SOCKS_PROXY http_proxy https_proxy all_proxy ftp_proxy socks_proxy
          python -m src.services.cloud_cn_daily_probe

  cn-intraday-readonly-probe:
    # One-stock, explicit manual read-only 5m diagnostic, independent of old
    # private smoke and accepted Tencent 1d behavior; no scheduler or mailbox.
    if: ${{ github.repository == 'leeningzzu/dsa-market-research' && github.event_name == 'workflow_dispatch' && inputs.mode == 'cn-intraday-readonly-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout existing DSA source
        uses: actions/checkout@v5
      - name: Use existing DSA Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install existing requirements only
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY FTP_PROXY SOCKS_PROXY http_proxy https_proxy all_proxy ftp_proxy socks_proxy
          python -m pip install -r requirements.txt
      - name: Inspect one completed CN 5m source without a proxy
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY FTP_PROXY SOCKS_PROXY http_proxy https_proxy all_proxy ftp_proxy socks_proxy
          python -m src.services.cloud_cn_intraday_probe
